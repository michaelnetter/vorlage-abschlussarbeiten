name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # nötig um Releases und Tags zu erstellen

    steps:
      - uses: actions/checkout@v4

      - name: Versionsnummer (Datum)
        id: date
        run: echo "version=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: ZIP erstellen
        run: zip -r Vorlage.zip main.tex literature.bib figures/ .latexmkrc

      - name: GitHub Release erstellen und ZIP anhängen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Version v${{ github.run_number }}
          body: "Automatisch generiertes Release vom ${{ steps.date.outputs.version }}"
          files: Vorlage.zip
